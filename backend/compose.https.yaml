services:
  diffusion-api:
    ports: []

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      - diffusion-api
    env_file:
      - .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caddy-data:
  caddy-config:
